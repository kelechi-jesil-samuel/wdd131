<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <meta name="author" content="Kelechi Jesil Samuel">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="script/form.js" defer></script>
</head>
<body>
<header><h1>Product Review</h1></header>
<main>
    <form method="get" action="review.html" class="review-form">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
            <option value="" disabled selected>Choose a Product ...</option>
        </select>

        <fieldset class="rating-field">
            <legend>Overall Rating</legend>
            <div class="stars">
                <label>★<br><input type="radio" id="rate1" name="rating" value="1" required></label>
                <label>★★<br><input type="radio" id="rate2" name="rating" value="2" required></label>
                <label>★★★<br><input type="radio" id="rate3" name="rating" value="3" required></label>
                <label>★★★★<br><input type="radio" id="rate4" name="rating" value="4" required></label>
                <label>★★★★★<br><input type="radio" id="rate5" name="rating" value="5" required></label>
            </div>
        </fieldset>

        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>

        <fieldset>
            <legend>Which features did you find useful in the product?<br><em>(Check all that apply)</em></legend>
            <label class="check"><input type="checkbox" id="feat1" name="features" value="Durability"> Durability</label>
            <label class="check"><input type="checkbox" id="feat2" name="features" value="Ease of Use"> Ease of Use</label>
            <label class="check"><input type="checkbox" id="feat3" name="features" value="Performances"> Performances</label>
            <label class="check"><input type="checkbox" id="feat4" name="features" value="Design"> Design</label>
        </fieldset>

        <label for="writtenReview">Written Review <span class="optional">(Optional)</span></label>
        <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>

        <label for="userName">Your Name <span class="optional">(Optional)</span></label>
        <input type="text" id="userName" name="userName">

        <input type="submit" value="Post Review">
    </form>
</main>
<footer>
    <p>©2026 🌷 Kelechi Jesil Samuel 🌷</p>
    <p>Lagos Nigeria</p>
    <p>Last Modification: <span id="lastModified"></span></p>
</footer>
</body>
</html>
